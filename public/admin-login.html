<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>Exam Controller Sign In</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
  <div class="app-layout">
    <main class="container wide">
      <header class="admin-header">
        <div class="brand-group">
          <span class="brand-badge">Admin Portal</span>
          <h1>Exam Controller Sign In</h1>
        </div>
      </header>
      <section class="card login-card">
        <div class="login-header">
          <div class="login-icon">🔐</div>
          <h2>Authorized Personnel</h2>
          <p class="sub">Sign in with your individual controller account.</p>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button id="loginBtn" type="submit" class="btn btn-primary btn-block">Sign In</button>
        </form>
        <div id="loginMsg" class="msg hidden" role="alert"></div>
      </section>
      <footer class="app-footer">
        <a href="/" class="admin-link">← Return to Student Search</a>
      </footer>
    </main>
  </div>
  <script src="/js/admin-login.js"></script>
</body>
</html>
